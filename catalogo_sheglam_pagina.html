<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo SHEGLAM 🎀</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #fff5fa;
    color: #3a2732;
  }
  .card {
    width: 100%;
    max-width: 430px;
    background: white;
    border-radius: 28px;
    padding: 42px 26px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(100, 40, 75, .12);
  }
  .emoji { font-size: 48px; margin-bottom: 12px; }
  h1 { margin: 0 0 10px; font-size: 28px; }
  p { margin: 0 auto 26px; line-height: 1.5; color: #765d6b; }
  a {
    display: block;
    text-decoration: none;
    background: #d94f91;
    color: white;
    padding: 16px 20px;
    border-radius: 16px;
    font-weight: 700;
    font-size: 17px;
  }
  .small { margin-top: 18px; font-size: 13px; color: #9b8490; }
</style>
</head>
<body>
  <main class="card">
    <div class="emoji">🎀</div>
    <h1>Catálogo SHEGLAM</h1>
    <p>Confira todos os produtos disponíveis no nosso catálogo.</p>
    <a href="https://drive.google.com/file/d/1f_c126545fHazJYbP6hbd7ZPceHqkwZb/view?usp=drivesdk">
      Clique aqui para ver o catálogo
    </a>
    <div class="small">Toque no botão para abrir o catálogo ✨</div>
  </main>
</body>
</html>
